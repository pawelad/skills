# Template-owned. The lychee hk step (offline) and `mise run audit` (online) share it.
# 429 means rate limited, so the link may still be fine.
accept = ["200..=299", "429"]
max_retries = 2
timeout = 20
# The paths that the prose rules call frozen: text that another program wrote.
exclude_path = [
  "openspec/changes/archive/",
  "openspec/schemas/",
  "/fixtures/",
  "/testdata/",
  "/__snapshots__/",
  "/generated/",
  "/vendor/",
]
