---
# Template-owned: edit in cubert, not in a project.
name: "PR title"

# A squash merge of several commits takes the PR title as its subject.
# A separate workflow, so a title edit does not run the full CI again.
on:
  pull_request:
    branches: ["main"]
    types: ["opened", "edited", "synchronize", "reopened"]

permissions: {}

jobs:
  conventional:
    name: "Conventional PR title"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 1
    # Checkout reads cliff.toml and the scope check script.
    permissions:
      contents: "read"
    steps:
      - name: "Checkout code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Check the title"
        env:
          TITLE: "${{ github.event.pull_request.title }}"
        run: |
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          pattern="^(${types})(\\([a-z0-9-]+\\))?!?: [^ ].*$"
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::Use a Conventional Commit title, kebab-case scope: $TITLE"
            exit 1
          fi
          python3 .config/hk/checks/check_commit_scope.py --subject "$TITLE"
