---
# Template-owned: edit in cubert, not in a project. The project's audit.yml calls it.
name: "cubert audit"

on:
  workflow_call:

permissions:
  contents: "read"

jobs:
  audit:
    name: "Audit"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 20
    steps:
      - name: "Check out the repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up mise"
        uses: "$/.github/actions/setup-mise"

      - name: "Audit the dependencies, actions and links"
        env:
          # zizmor needs it for its online audits. lychee uses it to avoid rate limits.
          GITHUB_TOKEN: "${{ github.token }}"
        run: "mise run audit"
